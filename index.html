<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Pro | VilchesLinense</title>
    <!-- Importamos una fuente elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0f1a;
            --accent: #00d2ff;
            --card: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 210, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 210, 255, 0.05) 0%, transparent 40%);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* BOTÓN VOLVER */
        .btn-volver {
            text-decoration: none;
            background: var(--card);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid var(--border);
            margin-bottom: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-volver:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        /* TARJETA PRINCIPAL */
        .card {
            background: var(--card);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 { margin: 0 0 30px 0; color: var(--accent); font-size: 1.8rem; }

        .input-group { margin-bottom: 25px; text-align: left; }
        
        label { 
            display: block; 
            margin-bottom: 10px; 
            color: #94a3b8; 
            font-size: 0.75rem; 
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
            box-sizing: border-box;
        }

        input:focus, select:focus { border-color: var(--accent); }

        /* ÁREA DE RESULTADO */
        .resultado-box {
            background: rgba(0, 210, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            border: 1px dashed var(--accent);
            margin-top: 20px;
        }

        #resultado { 
            font-size: 2.5rem; 
            font-weight: 800; 
            color: var(--accent); 
            margin: 0;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .info { font-size: 0.7rem; color: #64748b; margin-top: 10px; }
    </style>
</head>
<body>

    <a href="https://vilcheslinense4.github.io/Mi-primer-portafolios/" class="btn-volver">← Volver al Portafolio</a>

    <div class="card">
        <h2>💱 Conversor Pro</h2>
        
        <div class="input-group">
            <label>CANTIDAD EN EUROS (€)</label>
            <input type="number" id="cantidad" placeholder="Escribe un importe..." oninput="convertir()">
        </div>

        <div class="input-group">
            <label>CONVERTIR A:</label>
            <select id="moneda" onchange="convertir()">
                <optgroup label="Principales">
                    <option value="1.08">Dólar Estadounidense (USD)</option>
                    <option value="0.86">Libra Esterlina (GBP)</option>
                    <option value="168.45">Yen Japonés (JPY)</option>
                    <option value="0.97">Franco Suizo (CHF)</option>
                </optgroup>
                <optgroup label="Latinoamérica">
                    <option value="18.50">Peso Mexicano (MXN)</option>
                    <option value="950.40">Peso Chileno (CLP)</option>
                    <option value="4200.50">Peso Colombiano (COP)</option>
                    <option value="880.20">Peso Argentino (ARS)</option>
                    <option value="5.40">Real Brasileño (BRL)</option>
                </optgroup>
                <optgroup label="Otros">
                    <option value="1.62">Dólar Australiano (AUD)</option>
                    <option value="1.48">Dólar Canadiense (CAD)</option>
                    <option value="7.80">Yuan Chino (CNY)</option>
                </optgroup>
            </select>
        </div>

        <div class="resultado-box">
            <p id="resultado">0.00</p>
            <p class="info">Actualización instantánea</p>
        </div>
    </div>

    <script>
        function convertir() {
            const euros = document.getElementById('cantidad').value;
            const select = document.getElementById('moneda');
            const tasa = select.value;
            const monedaTexto = select.options[select.selectedIndex].text;
            const display = document.getElementById('resultado');

            if (euros > 0) {
                // Cálculo con 2 decimales y formato local
                const calculo = (euros * tasa).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                
                // Lógica de símbolos
                let simbolo = "";
                if (monedaTexto.includes("USD") || monedaTexto.includes("MXN") || monedaTexto.includes("CLP") || monedaTexto.includes("COP") || monedaTexto.includes("ARS")) {
                    simbolo = "$";
                } else if (monedaTexto.includes("GBP")) {
                    simbolo = "£";
                } else if (monedaTexto.includes("JPY") || monedaTexto.includes("CNY")) {
                    simbolo = "¥";
                } else if (monedaTexto.includes("BRL")) {
                    simbolo = "R$";
                } else {
                    simbolo = "";
                }

                display.innerText = `${simbolo}${calculo}`;
            } else {
                display.innerText = "0.00";
            }
        }
    </script>
</body>
</html>
