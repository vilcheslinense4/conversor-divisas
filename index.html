<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Pro | Real-Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --accent: #38bdf8;
            --card: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .btn-volver {
            text-decoration: none;
            color: var(--text-dim);
            font-size: 0.8rem;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-volver:hover { border-color: var(--accent); color: var(--accent); }

        .container { width: 100%; max-width: 450px; }

        .card {
            background: var(--card);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h2 { text-align: center; margin-bottom: 30px; font-weight: 800; color: var(--accent); }

        .box {
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }

        label { display: block; color: var(--text-dim); font-size: 0.75rem; margin-bottom: 5px; font-weight: 600; }

        .input-row { display: flex; align-items: center; gap: 10px; }

        input {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            width: 100%;
            outline: none;
        }

        select {
            background: var(--bg);
            color: white;
            border: 1px solid var(--border);
            padding: 5px;
            border-radius: 8px;
            font-weight: 600;
        }

        .swap-btn {
            display: block;
            margin: -5px auto 10px;
            background: var(--accent);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
            z-index: 2;
            position: relative;
        }

        .info-table {
            margin-top: 25px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            padding: 20px;
        }

        .info-title { font-size: 0.85rem; color: var(--accent); margin-bottom: 15px; font-weight: 700; text-align: center; }

        .row-table {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }
        .row-table:last-child { border: none; }
        .val-orig { font-weight: 600; }
        .val-dest { color: var(--accent); font-weight: 700; }
    </style>
</head>
<body>

    <a href="https://vilcheslinense4.github.io/Mi-primer-portafolios/" class="btn-volver">← Volver al Portafolio</a>

    <div class="container">
        <div class="card">
            <h2>Conversor Real-Time</h2>
            
            <div class="box">
                <label>DESDE</label>
                <div class="input-row">
                    <input type="number" id="input-top" value="1" oninput="calcular(true)">
                    <select id="select-top" onchange="calcular(true)">
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="USD">USD</option>
                    </select>
                </div>
            </div>

            <button class="swap-btn" onclick="swap()">⇅</button>

            <div class="box">
                <label>A</label>
                <div class="input-row">
                    <input type="number" id="input-bottom" oninput="calcular(false)">
                    <select id="select-bottom" onchange="calcular(true)">
                        <option value="GBP">GBP</option>
                        <option value="EUR" selected>EUR</option>
                        <option value="USD">USD</option>
                    </select>
                </div>
            </div>

            <div id="exchange-rate" style="text-align: center; font-size: 0.8rem; color: var(--text-dim); margin-top: 15px;">
                Cargando datos del mercado...
            </div>
        </div>

        <div class="info-table">
            <div class="info-title">📊 Escala de Cambio (Datos Reales)</div>
            <div id="tabla-dinamica"></div>
        </div>
    </div>

    <script>
        const apiURL = "https://open.er-api.com/v6/latest/EUR";
        let rates = {};

        async function obtenerTasasReales() {
            try {
                const respuesta = await fetch(apiURL);
                const datos = await respuesta.json();
                rates = datos.rates;
                calcular(true);
            } catch (error) {
                document.getElementById('exchange-rate').innerText = "Error al conectar con la API";
            }
        }

        function calcular(isTop) {
            if (!rates["GBP"]) return;
            const topCurr = document.getElementById('select-top').value;
            const botCurr = document.getElementById('select-bottom').value;
            const topInput = document.getElementById('input-top');
            const botInput = document.getElementById('input-bottom');
            const tasa = rates[botCurr] / rates[topCurr];

            if (isTop) {
                botInput.value = (topInput.value * tasa).toFixed(2);
            } else {
                topInput.value = (botInput.value / tasa).toFixed(2);
            }
            actualizarInfo(topCurr, botCurr, tasa);
        }

        function swap() {
            const sTop = document.getElementById('select-top');
            const sBot = document.getElementById('select-bottom');
            const temp = sTop.value;
            sTop.value = sBot.value;
            sBot.value = temp;
            calcular(true);
        }

        function actualizarInfo(tC, bC, tasa) {
            document.getElementById('exchange-rate').innerText = `1 ${tC} = ${tasa.toFixed(4)} ${bC}`;
            const tabla = document.getElementById('tabla-dinamica');
            const ejemplos = [1, 10, 100, 500, 1000, 1500];
            let html = "";
            ejemplos.forEach(val => {
                html += `<div class="row-table"><span class="val-orig">${val} ${tC}</span><span class="val-dest">${(val * tasa).toFixed(2)} ${bC}</span></div>`;
            });
            tabla.innerHTML = html;
        }

        obtenerTasasReales();
    </script>
</body>
</html>
